name: Vanmo
options:
  bundleIdPrefix: com.vanmo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Vanmo/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  VanmoCore:
    path: Packages/VanmoCore
  SWXMLHash:
    url: https://github.com/drmohundro/SWXMLHash.git
    majorVersion: 8.1.1
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    majorVersion: 8.8.1
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    majorVersion: 2.2.0
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient.git
    minorVersion: 0.3.1
  lottie-ios:
    url: https://github.com/airbnb/lottie-ios.git
    majorVersion: 4.6.0

targets:
  Vanmo:
    type: application
    platform: iOS
    dependencies:
      - package: VanmoCore
      - package: SWXMLHash
      - package: Kingfisher
      - package: KSPlayer
      - package: SMBClient
      - package: lottie-ios
        product: Lottie
    sources:
      - path: Vanmo
        excludes:
          - "**/*.xcassets/**/Contents.json"
          - "Frameworks/**"
    resources:
      - path: Vanmo/Resources/Assets.xcassets
      - path: Vanmo/Resources/Info.plist
      - path: Vanmo/Resources/loadingSpinner.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanmo.app
        INFOPLIST_FILE: Vanmo/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: Vanmo/Vanmo-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - "FFMPEG_ENABLED=1"
          - "$(inherited)"
        OTHER_SWIFT_FLAGS:
          - "-DFFMPEG_ENABLED"
        OTHER_LDFLAGS:
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-framework"
          - "Security"
          - "-framework"
          - "CoreFoundation"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Vanmo/Vanmo.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Vanmo/Vanmo-Cloud.entitlements
          OTHER_SWIFT_FLAGS:
            - "-DFFMPEG_ENABLED"
            - "-DCLOUDKIT_SYNC_ENABLED"
    entitlements:
      path: Vanmo/Vanmo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.vanmo.app
    postBuildScripts:
      - name: Fix KSPlayer Framework Plist
        script: |
          FRAMEWORK="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libshaderc_combined.framework"
          if [ -d "$FRAMEWORK" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.kintan.ksplayer.libshaderc-combined" "$FRAMEWORK/Info.plist" 2>/dev/null || true
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "$FRAMEWORK"
          fi

  Vanmo-macOS:
    type: application
    platform: macOS
    dependencies:
      - package: VanmoCore
      - package: Kingfisher
      - package: KSPlayer
      - package: lottie-ios
        product: Lottie
    sources:
      - path: VanmoMac
      - path: Vanmo/Shared/Components/MediaTitleLogoView.swift
      - path: Vanmo/Shared/Components/LoadingIndicatorView.swift
    resources:
      - path: VanmoMac/Resources/Info-Mac.plist
      - path: VanmoMac/Resources/Assets.xcassets
      - path: VanmoMac/Resources/loadingSpinner.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanmo.app.mac
        INFOPLIST_FILE: VanmoMac/Resources/Info-Mac.plist
        GENERATE_INFOPLIST_FILE: false
        VALIDATE_PRODUCT: NO
        OTHER_SWIFT_FLAGS:
          - "-DFFMPEG_ENABLED"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VanmoMac/Vanmo-Mac.entitlements
          DEVELOPMENT_TEAM: L775YJ7YS4
        Release:
          CODE_SIGN_ENTITLEMENTS: VanmoMac/Vanmo-Mac-Cloud.entitlements
          DEVELOPMENT_TEAM: L775YJ7YS4
          OTHER_SWIFT_FLAGS:
            - "-DFFMPEG_ENABLED"
            - "-DCLOUDKIT_SYNC_ENABLED"
    entitlements:
      path: VanmoMac/Vanmo-Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.vanmo.app.mac
    postBuildScripts:
      - name: Fix KSPlayer Framework Plist
        script: |
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          if [ ! -d "$FRAMEWORKS_DIR" ]; then
            exit 0
          fi
          for FRAMEWORK in "$FRAMEWORKS_DIR"/*.framework; do
            [ -d "$FRAMEWORK" ] || continue
            if [ -f "$FRAMEWORK/Info.plist" ] && [ ! -d "$FRAMEWORK/Versions" ]; then
              mkdir -p "$FRAMEWORK/Versions/A/Resources"
              mv "$FRAMEWORK/Info.plist" "$FRAMEWORK/Versions/A/Resources/Info.plist"
              if [ -d "$FRAMEWORK/Headers" ]; then
                mv "$FRAMEWORK/Headers" "$FRAMEWORK/Versions/A/Headers"
              fi
              if [ -d "$FRAMEWORK/Modules" ]; then
                mv "$FRAMEWORK/Modules" "$FRAMEWORK/Versions/A/Modules"
              fi
              BIN_NAME="$(defaults read "$FRAMEWORK/Versions/A/Resources/Info.plist" CFBundleExecutable 2>/dev/null || basename "$FRAMEWORK" .framework)"
              if [ -f "$FRAMEWORK/$BIN_NAME" ]; then
                mv "$FRAMEWORK/$BIN_NAME" "$FRAMEWORK/Versions/A/$BIN_NAME"
              fi
              ln -sf A "$FRAMEWORK/Versions/Current"
              ln -sf Versions/Current/Headers "$FRAMEWORK/Headers" 2>/dev/null || true
              ln -sf Versions/Current/Modules "$FRAMEWORK/Modules" 2>/dev/null || true
              ln -sf Versions/Current/Resources "$FRAMEWORK/Resources" 2>/dev/null || true
              ln -sf Versions/Current/$BIN_NAME "$FRAMEWORK/$BIN_NAME" 2>/dev/null || true
            fi
            if [ -f "$FRAMEWORK/Versions/Current/Resources/Info.plist" ] || [ -f "$FRAMEWORK/Resources/Info.plist" ]; then
              PLIST="${FRAMEWORK}/Versions/Current/Resources/Info.plist"
              [ -f "$PLIST" ] || PLIST="${FRAMEWORK}/Resources/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.kintan.ksplayer.$(basename "$FRAMEWORK" .framework | tr '[:upper:]' '[:lower:]')" "$PLIST" 2>/dev/null || true
            fi
            # Versions 结构下根目录的 _CodeSignature 会导致 codesign: unsealed contents
            if [ -d "$FRAMEWORK/Versions" ] && [ -d "$FRAMEWORK/_CodeSignature" ]; then
              rm -rf "$FRAMEWORK/_CodeSignature"
            fi
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ] && [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
              /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "$FRAMEWORK"
            fi
          done

schemes:
  Vanmo:
    build:
      targets:
        Vanmo: all
    run:
      config: Debug
    archive:
      config: Release
  Vanmo-macOS:
    build:
      targets:
        Vanmo-macOS: all
    run:
      config: Debug
    archive:
      config: Release
